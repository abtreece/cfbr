# News/availability archive sources. Every fetch is stored with the time it was
# fetched, which is what makes the archive usable point-in-time.
#
# Policy (checked live on every run, see src/cfbr/news/policy.py):
#   - robots.txt must allow the URL for our user agent;
#   - sites whose robots.txt names an AI agent (anthropic-ai, ClaudeBot, GPTBot,
#     Google-Extended, ...) are skipped, because this archive feeds a language model.
#     Blocking only CCBot (Common Crawl) is not treated as an AI opt-out;
#   - bot challenges are never bypassed: a challenged source is skipped.
# Excluded on that basis (2026-10-11): secsports.com (incl. SEC reports served via
# the HD Intelligence embed), espn.com, sports.yahoo.com, cbssports.com, theathletic.com.
#
# Official availability coverage (2026-10-11): Big Ten, ACC, Big 12, American, MAC
# (all via the HD Intelligence embed on the conference's own page). Not yet collected:
# SEC (AI opt-out), Pac-12, Mountain West, Sun Belt (no report found on the linked
# pages yet), Conference USA (different vendor, image graphics), independents. Coverage
# is expected to stay incomplete; the model must treat "no report" as unknown.

user_agent = "cfb-ratings-news-collector/0.1 (personal research; low-frequency)"
min_seconds_between_requests_per_host = 5

[[source]]
name = "big_ten_availability"
kind = "availability_page"   # official report, rendered in a headless browser
url = "https://bigten.org/fb/availability-reports/"
tier = "official"

