# News/availability archive sources. Every fetch is stored with the time it was
# fetched, which is what makes the archive usable point-in-time.
#
# Policy (src/cfbr/news/policy.py):
#   - robots.txt must allow the URL for our user agent (checked live every run);
#   - every source needs a recorded terms-of-use review (`terms`) before it is
#     collected; terms that prohibit automated collection exclude the source;
#   - bot challenges are never bypassed and private vendor APIs are never called
#     directly; official reports are captured by rendering the conference's own page.
#
# Excluded after terms review (2026-10-11), all prohibiting automated collection:
#   secsports.com and espn.com (Disney Terms of Use: no automated access to compile any
#   data set, machine learning named), on3.com (no scraping/crawling by automated tool,
#   incl. for AI/ML), cbssports.com (CBS Interactive: no unauthorized scraping, data
#   mining or automated gathering), sports.yahoo.com (Yahoo: no automated data collection
#   for any purpose without permission), The Athletic / nytimes.com (NYT: no automated
#   collection; no use for ML/AI).
#
# Official availability coverage (2026-10-11): Big Ten, ACC, Big 12, American, MAC
# (all via the HD Intelligence embed on the conference's own page). Not yet collected:
# SEC (Disney Terms of Use), Pac-12, Mountain West, Sun Belt (no report found on the
# linked pages yet), Conference USA (different vendor, image graphics), independents.
# Coverage is expected to stay incomplete; the model must treat "no report" as unknown.

user_agent = "cfb-ratings-news-collector/0.1 (personal research; low-frequency)"
min_seconds_between_requests_per_host = 5

[[source]]
name = "big_ten_availability"
kind = "availability_page"   # official report, rendered in a headless browser
url = "https://bigten.org/fb/availability-reports/"
tier = "official"
terms = "2026-10-11: site runs on SIDEARM; SIDEARM Terms of Service contain no restriction on automated access; bigten.org publishes no separate terms; report embed (HD Intelligence) publishes no terms"

