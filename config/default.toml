# All tunables live here. Copy and edit for experiments; tuned values go in config/tuned.toml.

[paths]
raw_dir = "data/raw"
db_path = "data/cfb.duckdb"
results_dir = "results"
out_dir = "out"

[ingest]
base_url = "https://apinext.collegefootballdata.com"
first_season = 2014
# Extra recruiting years before first_season so the 4-year average exists for 2014.
recruiting_lookback = 3
monthly_quota = 1000
# Refuse to start a command if fewer than this many calls would remain.
quota_reserve = 50

[prep.garbage_time]
enabled = true
q2 = 38
q3 = 28
q4 = 22

[prep]
# "single" = one pooled FCS entity; "conference" = one entity per FCS conference.
fcs_pooling = "single"

[model]
alpha_ppa = 300.0
alpha_sr = 300.0
# 0 disables within-season recency weighting.
half_life_weeks = 0.0
# 0 disables the k/(k+games) prior weight; alpha alone controls prior strength.
prior_k = 0.0

[baseline]
margin_cap = 28
alpha = 10.0

[prior]
# hybrid: LOSO inside tuning seasons, expanding window for holdout/live seasons.
fit_scheme = "hybrid"
# "v1" (default) or "roster" (adds player-level roster/transfer features; see DECISIONS.md).
features = "v1"

[seasons]
tuning = [2015, 2021]
holdout = [2022, 2025]

[backtest]
# Closing spread benchmark: median across providers of `spread`.
spread_consensus = "median"

[bets]
# Paper-trading tracker: reports and grades hypothetical bets; never places one.
enabled = true
# Paper bet when the model and the consensus line differ by at least this many points.
threshold = 3.0
# Assumed price for every spread bet (CFBD has no spread prices).
odds = -110
stake = 1.0
# Settled bets needed before the summary draws conclusions.
min_sample = 500
# Offshore books count as market data (consensus line) but are never used to price a bet.
offshore_books = ["Bovada", "BetOnline", "LowVig", "MyBookie", "BetUS", "Bookmaker", "5Dimes", "SportsBetting", "Heritage"]
# Books a bet may be priced at (best line). All books still feed the consensus line.
# bet365 has no US feed in CFBD or The Odds API today, so in practice DraftKings and FanDuel.
pricing_books = ["DraftKings", "FanDuel", "bet365"]
# Dollar reporting only: starting bankroll, and one unit = 1% of it, so a 1-unit bet
# at -110 risks $11 to win $10 (week 1 can carry ~75 bets at once; 1% keeps that under the bankroll).
bankroll = 1000.0
unit_value = 10.0

# Reporting tiers by edge size (name = minimum |edge| in points). Stakes stay flat.
[bets.tiers]
Small = 3.0
Medium = 6.0
Large = 10.0

[odds]
# The Odds API snapshots (US sportsbook spreads with prices) for the paper-bet tracker.
# Key: ODDS_API_KEY (or ODD_API_KEY) in the env or .keys. Free tier: 500 credits/month.
enabled = true
# One credit per region per call. us = DraftKings, FanDuel, BetRivers, BetMGM + offshore;
# us2 = theScore Bet, Hard Rock Bet, Bally Bet, betPARX.
regions = ["us", "us2"]
monthly_quota = 500
quota_reserve = 50
# Only combine with the CFBD line snapshot when the two were taken this close together.
max_snapshot_gap_hours = 6.0
