# All tunables live here. Copy and edit for experiments; tuned values go in config/tuned.toml.

[paths]
raw_dir = "data/raw"
db_path = "data/cfb.duckdb"
results_dir = "results"
out_dir = "out"

[ingest]
base_url = "https://apinext.collegefootballdata.com"
first_season = 2014
# Extra recruiting years before first_season so the 4-year average exists for 2014.
recruiting_lookback = 3
monthly_quota = 1000
# Refuse to start a command if fewer than this many calls would remain.
quota_reserve = 50
# `cfbr scores` (midweek final scores for the site) stops calling at this many calls left,
# so it never spends what Sunday's `cfbr weekly` needs.
scores_quota_reserve = 120
# `cfbr weekly` waits out a CFBD outage (5xx, 429, timeout) instead of crashing: up to this many
# ingest retries this many minutes apart (an hour by default, so the 9 AM run still lands that morning).
outage_retries = 6
outage_wait_minutes = 10

# Thresholds are Bill Connelly's (SP+) garbage-time definition. tuned.toml disables the filter.
[prep.garbage_time]
enabled = true
q2 = 38
q3 = 28
q4 = 22

[prep]
# "single" = one pooled FCS entity; "conference" = one entity per FCS conference.
fcs_pooling = "single"

[model]
alpha_ppa = 300.0
alpha_sr = 300.0
# 0 disables within-season recency weighting.
half_life_weeks = 0.0
# 0 disables the k/(k+games) prior weight; alpha alone controls prior strength.
prior_k = 0.0

[baseline]
margin_cap = 28
alpha = 10.0

[prior]
# hybrid: LOSO inside tuning seasons, expanding window for holdout/live seasons.
fit_scheme = "hybrid"
# "v1" (default) or "roster" (adds player-level roster/transfer features; see DECISIONS.md).
features = "v1"

[seasons]
tuning = [2015, 2021]
holdout = [2022, 2025]

[backtest]
# Closing spread benchmark: median across providers of `spread`.
spread_consensus = "median"

[bets]
# Paper-trading tracker: reports and grades hypothetical bets; never places one.
enabled = true
# Paper bet when the model and the consensus line differ by at least this many points.
threshold = 3.0
# Assumed price for every spread bet (CFBD has no spread prices).
odds = -110
stake = 1.0
# Settled bets needed before the summary draws conclusions.
min_sample = 500
# Offshore books count as market data (consensus line) but are never used to price a bet.
offshore_books = ["Bovada", "BetOnline", "LowVig", "MyBookie", "BetUS", "Bookmaker", "5Dimes", "SportsBetting", "Heritage"]
# Books a bet may be priced at (best line). All books still feed the consensus line.
# bet365 has no US feed in CFBD or The Odds API today, so in practice DraftKings and FanDuel.
pricing_books = ["DraftKings", "FanDuel", "bet365"]
# Books a viewer may pick for the real-money shortlist; never offshore. No choice = pricing_books.
selectable_books = ["DraftKings", "FanDuel", "bet365", "BetMGM", "BetRivers", "Bally Bet", "betPARX", "theScore Bet"]
# Dollar reporting only: starting bankroll, and one unit = 1% of it, so a 1-unit bet
# at -110 risks $11 to win $10 (week 1 can carry ~75 bets at once; 1% keeps that under the bankroll).
bankroll = 1000.0
unit_value = 10.0

# Reporting tiers by edge size (name = minimum |edge| in points). Stakes stay flat.
[bets.tiers]
Small = 3.0
Medium = 6.0
Large = 10.0

[odds]
# The Odds API snapshots (US sportsbook spreads with prices) for the paper-bet tracker.
# Key: ODDS_API_KEY (or ODD_API_KEY) in the env or .keys. Free tier: 500 credits/month.
enabled = true
# One credit per region per call. us = DraftKings, FanDuel, BetRivers, BetMGM + offshore;
# us2 = theScore Bet, Hard Rock Bet, Bally Bet, betPARX.
regions = ["us", "us2"]
monthly_quota = 500
quota_reserve = 50
# Only combine with the CFBD line snapshot when the two were taken this close together.
max_snapshot_gap_hours = 6.0
# Closing lines: consensus from the last Odds API snapshot before kickoff (if no older than
# this); `cfbr odds-snapshot` (cron, Tue-Sat) only pulls when a game kicks off within the window.
closing_max_age_hours = 12.0
snapshot_window_hours = 6.0

[oddspapi]
# OddsPapi v4: bet365 spreads for pricing paper bets only (never in the consensus).
# Key: ODDSPAPI_KEY in the env or .keys. Free tier: 250 requests/month; one per game bet,
# plus one fixture list per run, so only games the tracker is about to bet are fetched.
enabled = true
books = ["bet365"]
monthly_quota = 250
quota_reserve = 20

[alerts]
# Push alerts when `cfbr weekly` fails or its post-run check finds a problem, via ntfy
# (install the ntfy app and subscribe to the topic). Topic: NTFY_TOPIC in the env or .keys.
enabled = true
server = "https://ntfy.sh"

[backup]
# `cfbr backup` (nightly cron): rsync data/raw, data/news and the paper-bet ledgers, hash
# chains and history to `target`. Local for now (a different disk or an off-machine mount
# is better). Deleted/changed files are kept under target/_previous/{date}/ for
# keep_previous_days. The weekly health check flags a backup older than max_age_days.
target = "~/cfbr-backup"
include_db = false
keep_previous_days = 30
max_age_days = 8.0

[sim]
# Monte Carlo season simulation (cfbr sim / weekly): conference titles and playoff odds.
enabled = true
n_sims = 100000
seed = 0
# Per-team strength offset per simulated season (points); chosen on 2015-2021 win totals.
tau = 6.0
# 2026 CFP: 12 teams, auto bids for these champions, the top Group of Six champion
# ("champion") or team ("team"), and Notre Dame if ranked in the top 12. Seeds 1-4 get byes.
power_conferences = ["SEC", "Big Ten", "ACC", "Big 12"]
group_of_six_bid = "champion"
notre_dame_top = 12
field_size = 12
byes = 4
# Committee-ranking proxy: strength - losses_weight * losses + bonuses (fit on 2015-2021).
losses_weight = 6.5
champion_bonus = 0.0
power_bonus = 10.0
