[project]
name = "cfbr"
version = "0.1.0"
description = "Predictive college football rating engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "duckdb>=1.1",
  "polars>=1.9",
  "pyarrow>=17",
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "pydantic>=2.9",
  "typer>=0.12",
  "joblib>=1.4",
  "optuna>=4.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "playwright==1.49.1",
]

[project.scripts]
cfbr = "cfbr.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfbr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
