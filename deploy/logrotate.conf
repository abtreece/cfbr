# Rotate cfbr's cron logs (run by the daily `cfbr check` cron line; see README "Cron").
# Weekly runs append full prep output each time, so the weekly log grows ~1 MB a run.
/home/abtreece/cfb-ratings/data/weekly.log
/home/abtreece/cfb-ratings/data/web.log
/home/abtreece/cfb-ratings/data/backup.log
/home/abtreece/cfb-ratings/data/odds.log
/home/abtreece/cfb-ratings/data/odds-snapshot.log
/home/abtreece/cfb-ratings/data/check.log
/home/abtreece/cfb-ratings/data/scores.log {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
